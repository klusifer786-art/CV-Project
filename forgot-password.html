<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="http://localhost:3000">
    <title>CV Generator - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-wrapper">
        <div class="header">
            <h1>Forgot Password?</h1>
            <p>Enter your account email and we’ll send a reset link if it exists.</p>
        </div>
        <div class="card">
            <form id="forgot-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="name@example.com">
                </div>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                <button type="submit" class="btn-primary" id="submit-button">Send Reset Link</button>
            </form>
        </div>
        <div class="footer-link">
            Remembered it? <a href="Index.html">Back to Login</a>
        </div>
    </main>
    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('forgot-form');
        const message = document.getElementById('form-message');
        const button = document.getElementById('submit-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            message.className = 'form-message';
            button.disabled = true;
            try {
                const response = await apiRequest('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Could not send reset email.');
                message.textContent = result.message;
                message.classList.add('success');
            } catch (error) {
                console.error('Password reset request failed:', error);
                message.textContent = error.message || 'Could not connect to the server.';
                message.classList.add('error');
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
