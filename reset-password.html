<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="http://localhost:3000">
    <title>Set New Password - CV Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-wrapper">
        <div class="header">
            <h1>Set a New Password</h1>
            <p>Choose a password with at least 8 characters.</p>
        </div>
        <div class="card">
            <form id="reset-form">
                <div class="input-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
                </div>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                <button type="submit" class="btn-primary" id="submit-button">Reset Password</button>
            </form>
        </div>
        <div class="footer-link">
            <a href="Index.html">Back to Login</a>
        </div>
    </main>
    <script src="auth.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('reset-form');
        const message = document.getElementById('form-message');
        const button = document.getElementById('submit-button');

        if (!token) {
            form.hidden = true;
            message.textContent = 'This password reset link is invalid or expired.';
            message.classList.add('error');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            message.className = 'form-message';
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            if (newPassword !== confirmPassword) {
                message.textContent = 'Passwords do not match.';
                message.classList.add('error');
                return;
            }

            button.disabled = true;
            try {
                const response = await apiRequest('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Could not reset password.');
                message.textContent = result.message;
                message.classList.add('success');
                form.dataset.complete = 'true';
                form.querySelectorAll('input, button').forEach(control => { control.disabled = true; });
            } catch (error) {
                console.error('Password reset failed:', error);
                message.textContent = error.message || 'Could not connect to the server.';
                message.classList.add('error');
            } finally {
                if (!form.dataset.complete) button.disabled = false;
            }
        });
    </script>
</body>
</html>
